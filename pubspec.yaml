name: pve_monitoring_app
description: "An app to view the state of your Proxmox Virtual Environment instance."
publish_to: 'none'
version: 0.0.0

environment:
  sdk: ^3.5.2

dependencies:
  flutter:
    sdk: flutter
  dio: ^5.7.0
  json_annotation: ^4.9.0
  retrofit: ^4.4.1
  get_it: ^7.7.0
  injectable: ^2.4.4
  flutter_bloc: ^8.1.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  build_runner: ^2.4.12
  json_serializable: ^6.8.0
  retrofit_generator: ^9.1.1
  injectable_generator: ^2.6.2

flutter:
  uses-material-design: true
